name: Build and Deploy to Hostinger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Lint, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Deploy static build directly to Hostinger public_html using standard OpenSSH SCP
      - name: Deploy Build to Hostinger via SCP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST || '82.25.125.141' }}
          USER: ${{ secrets.HOSTINGER_USER || 'u932835494' }}
          PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          
          # Remove Hostinger default placeholder files if present
          sshpass -e ssh -p "$PORT" -o StrictHostKeyChecking=no "$USER@$HOST" "
            mkdir -p public_html domains/swiftgst.in/public_html
            rm -f public_html/default.php public_html/default.html domains/swiftgst.in/public_html/default.php domains/swiftgst.in/public_html/default.html
          " || true

          # Upload to domains/swiftgst.in/public_html (Hostinger domain directory)
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no -r out/* "$USER@$HOST:domains/swiftgst.in/public_html/" || true

          # Also upload to root public_html
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no -r out/* "$USER@$HOST:public_html/"
