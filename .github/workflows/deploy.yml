name: Build and Deploy to Hostinger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Lint, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Deploy static build directly to swiftgst.in on Hostinger
      - name: Deploy Build to Hostinger via SCP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: '82.25.125.141'
          USER: ${{ secrets.HOSTINGER_USER || 'u932835494' }}
          PORT: '65002'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          shopt -s dotglob
          for i in 1 2 3; do
            echo "Deployment attempt $i/3..."
            if sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ConnectionAttempts=3 -r out/* "$USER@$HOST:domains/swiftgst.in/public_html/"; then
              echo "Deployment succeeded!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          echo "Deployment failed after 3 attempts."
          exit 1
