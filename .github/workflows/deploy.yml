name: Build and Deploy to Hostinger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Lint, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy Build to Hostinger via SCP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST || '82.25.125.141' }}
          username: ${{ secrets.HOSTINGER_USER || 'u932835494' }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          # Next.js static production build folder is 'out/*'
          source: "out/*"
          target: ${{ secrets.HOSTINGER_TARGET || 'public_html' }}
          strip_components: 1
